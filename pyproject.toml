[project]
name = "jarvis"
version = "0.0.1"
description = "Personal voice assistant (working name) - Tony Stark style"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot",
    "anthropic",
    "google-genai",
    "groq>=1.7.0",
    "google-auth>=2.61.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
